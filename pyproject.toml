[project]
name = "slidekit"
version = "0.1.0"
description = "Thin helpers for editable PowerPoint decks that look like an expert made them"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10",
    "pypandoc-binary>=1.15",
    "pypdfium2>=4.30",
    "python-pptx>=1.0.2",
]

[project.scripts]
slidekit = "slidekit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slidekit"]
